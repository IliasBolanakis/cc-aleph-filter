name: CC-Aleph CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # Ensure AVX2 and BMI2 instructions are emitted consistently on runner architectures
  RUSTFLAGS: "-C target-feature=+avx2,+bmi2"

jobs:
  check-and-test:
    name: Lint, Test & Bench Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies & Build Artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify Formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Run Static Analysis (cargo clippy)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Test Suite (cargo test)
        run: cargo test --release --all-targets -- --nocapture

      - name: Verify Benchmarks Compile (cargo bench --no-run)
        run: cargo bench --no-run